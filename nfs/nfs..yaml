apiVersion: v1
kind: Namespace
metadata:
  name: nfs
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  namespace: nfs
spec:
  selector:
    app: nfs-server
  ports:
    - name: nfs
      port: 2049
    - name: mountd
      port: 20048
---
apiVersion: v1
kind: Pod
metadata:
  name: nfs-server
  namespace: nfs
  labels:
    app: nfs-server
spec:
  containers:
    - name: nfs-server
      image: itsthenetwork/nfs-server-alpine
      securityContext:
        privileged: true
      env:
        - name: SHARED_DIRECTORY
          value: /exports
      ports:
        - containerPort: 2049
      volumeMounts:
        - name: nfs-volume
          mountPath: /exports
  volumes:
    - name: nfs-volume
      emptyDir: {}