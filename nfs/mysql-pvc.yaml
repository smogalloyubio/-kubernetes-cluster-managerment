apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: nfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql-database
          image: mysql:8
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: admin
            - name: MYSQL_USER
              value: admin
            - name: MYSQL_PASSWORD
              value: admin

          volumeMounts:
            - name: mysql-vol
              mountPath: /var/lib/mysql

      volumes:
        - name: mysql-vol
          persistentVolumeClaim:
            claimName: mysql-pvc-claim